<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - {{ site_description }}</title>
    <!-- OGP_META_TAGS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .navbar {
            background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%) !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            color: #e94560 !important;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #fff !important;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #e94560 !important;
        }

        .search-form input {
            border-radius: 20px;
        }

        .search-form button {
            border-radius: 20px;
            background: #e94560 !important;
            border: none;
        }

        .header-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            margin: 0 0 3rem 0;
        }

        .header-section h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #e94560, #ff6b7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-section p {
            font-size: 1.2rem;
            color: #b0b0b0;
        }

        /* メインコンテンツ */
        .main-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            margin: 0 auto 3rem auto;
            max-width: 1400px;
            width: 90%;
        }

        /* グリッドレイアウト */
        .main-container .row {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 2rem !important;
            justify-content: center !important;
            margin: 0 !important;
        }

        /* 800px以上：3列 */
        @media (min-width: 801px) {
            .article-card-wrapper {
                width: calc(33.333% - 1.35rem);
                flex: 0 0 auto;
            }
        }

        /* 800px以下：1列 */
        @media (max-width: 800px) {
            .article-card-wrapper {
                width: 100%;
                max-width: 500px;
                margin: 0 auto;
            }

            .main-container {
                padding: 1rem;
            }

            .header-section h1 {
                font-size: 2rem;
            }

            .header-section p {
                font-size: 1rem;
            }
        }

        /* カード */
        .article-card {
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.2);
        }

        .article-card .card-img-top {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        .article-card .card-body {
            flex-grow: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .article-card .card-title {
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.4;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .article-card .card-text {
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .category-tag {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            border-radius: 12px;
            font-weight: 600;
            margin-right: 0.5rem;
        }

        .category-tag.switch { background: #3b82f6; color: white; }
        .category-tag.ps5 { background: #1f2937; color: white; }
        .category-tag.xbox { background: #16a34a; color: white; }
        .category-tag.pc { background: #8b5cf6; color: white; }
        .category-tag.steam { background: #0f172a; color: white; }
        .category-tag.nintendo { background: #dc2626; color: white; }

        .hot-news-label {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.8rem;
            z-index: 10;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 記事詳細 */
        .article-detail {
            background: white;
            padding: 3rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin: 0 auto 3rem auto;
            max-width: 900px;
            width: 90%;
        }

        .article-detail h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            color: #1a1a2e;
            line-height: 1.3;
        }

        .article-detail img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .article-body {
            line-height: 1.8;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .article-body a {
            color: #e94560;
            text-decoration: none;
        }

        .article-body a:hover {
            text-decoration: underline;
        }

        .article-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        /* ページネーション */
        .pagination {
            margin-top: 3rem;
            justify-content: center !important;
        }

        .pagination .page-link {
            color: #e94560;
            border: 1px solid #e94560;
        }

        .pagination .page-item.active .page-link {
            background: #e94560 !important;
            border-color: #e94560 !important;
        }

        /* フッター */
        footer {
            background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 3rem 2rem 2rem;
            margin-top: 3rem;
            text-align: center;
        }

        footer h5 {
            color: #e94560;
            margin-bottom: 1rem;
        }

        footer a {
            color: #e94560;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer .btn-warning {
            background: #e94560 !important;
            border: none !important;
        }

        /* スマホ対応 */
        @media (max-width: 576px) {
            .header-section h1 {
                font-size: 1.5rem;
            }

            .article-detail {
                padding: 1.5rem;
            }

            .article-detail h1 {
                font-size: 1.5rem;
            }

            .article-actions {
                flex-direction: column;
            }

            .article-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">{{ site_name }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">トップ</a>
                    </li>
                </ul>
                <form class="d-flex search-form ms-3" method="get" action="/search">
                    <input class="form-control" type="search" name="q" placeholder="検索...">
                    <button class="btn btn-outline-light" type="submit">🔍</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- ヘッダーセクション -->
    <div class="header-section">
        <div class="container">
            <h1>{{ site_name }}</h1>
            <p>{{ site_description }}</p>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container main-container">
        <div class="row g-4">
            <!-- ARTICLES_PLACEHOLDER -->
        </div>

        <!-- ページネーション -->
        <!-- PAGINATION_PLACEHOLDER -->
    </div>

    <!-- フッター -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <h5>今月の注目ランキング</h5>
                    <p>最新のゲーム売れ筋ランキングをチェック！</p>
                    <a href="https://www.amazon.co.jp/gp/bestsellers/videogames/ref=zg_bs_nav_0" class="btn btn-warning btn-lg" target="_blank" rel="noopener noreferrer">
                        🏆 Amazon ゲーム売れ筋ランキングを見る
                    </a>
                </div>
                <div class="col-md-4 text-end">
                    <p>&copy; 2026 {{ site_name }}</p>
                    <p><a href="#">プライバシーポリシー</a> | <a href="#">お問い合わせ</a></p>
                    <p style="margin-top: 1rem; font-size: 0.9rem;">すべての権利は著作者に帰属します。</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // スムーズスクロール
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // 検索フォームの送信
        document.querySelector('.search-form')?.addEventListener('submit', function(e) {
            const query = this.querySelector('input[name="q"]').value.trim();
            if (!query) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
