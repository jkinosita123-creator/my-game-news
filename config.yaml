site:
  name: "最新ゲームニュース・情報まとめ"
  description: "最新ゲームニュース・情報まとめ"
  language: "ja"
  base_url: "https://my-game-news.onrender.com/"

database:
  path: "./articles.db"

rss_feeds:
  - url: "https://feeds.famitsu.com/feed/rss2"
    source: "ファミ通"
    priority: 1
  - url: "https://www.4gamer.net/rss/"
    source: "4Gamer"
    priority: 2
  - url: "https://news.denfaminicogamer.jp/feed"
    source: "ファミゲーム"
    priority: 2
  - url: "https://news.google.com/rss/search?q=ゲーム&hl=ja&gl=JP&ceid=JP:ja"
    source: "Google News"
    priority: 2

crawler:
  interval_minutes: 15
  timeout_seconds: 30
  max_articles: 500
  cleanup_days: 30

affiliate:
  amazon:
    enabled: true
    tracking_id: "tyoukinoko-22"
    region: "JP"
  rakuten:
    enabled: true
    affiliate_id: "YOUR_RAKUTEN_AFFILIATE_ID"
    service_id: "YOUR_RAKUTEN_SERVICE_ID"
  google_adsense:
    enabled: true
    publisher_id: "YOUR_GOOGLE_ADSENSE_ID"
    ad_slot: "YOUR_AD_SLOT_ID"

keywords:
  affiliate_targets:
    - keyword: "Switch"
      product_type: "gaming_console"
      affiliate_links:
        - type: "amazon"
          url_pattern: "https://www.amazon.co.jp/s?k=Nintendo+Switch"
        - type: "rakuten"
          url_pattern: "https://www.rakuten.co.jp/search/mall/Nintendo+Switch/"
    - keyword: "PS5"
      product_type: "gaming_console"
      affiliate_links:
        - type: "amazon"
          url_pattern: "https://www.amazon.co.jp/s?k=PlayStation+5"
        - type: "rakuten"
          url_pattern: "https://www.rakuten.co.jp/search/mall/PlayStation+5/"
    - keyword: "予約開始"
      product_type: "preorder"
    - keyword: "新作"
      product_type: "new_release"
    - keyword: "限定版"
      product_type: "limited_edition"
    - keyword: "限定"
      product_type: "limited"
    - keyword: "特典"
      product_type: "bonus"
    - keyword: "発売日決定"
      product_type: "release_date"

server:
  host: "0.0.0.0"
  port: 9000
  workers: 1
  reload: false

logging:
  level: "INFO"
  file: "./logs/app.log"
